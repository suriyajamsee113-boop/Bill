
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมหารค่าอาหาร (Thai Modern Dark)</title>
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #b59021;
            --danger: #ff5f56;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #2a374a;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text);
            background-color: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .btn-tool {
            padding: 8px 12px;
            font-size: 12px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-share { background: #0284c7; color: white; border: none; }
        .btn-share:hover { background: #0369a1; }

        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        /* จัดการการแสดงผลตามสิทธิ์ */
        .admin-only { display: block; }

        .section { margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }

        input { padding: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 6px; width: 100%; }

        button { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-gold { background: var(--primary); color: var(--bg); width: 100%; }
        .btn-del { background: var(--danger); color: white; padding: 4px 8px; font-size: 11px; }

        .friend-list-area { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed var(--border); }
        .friend-tag { background: var(--input-bg); color: var(--primary); padding: 4px 10px; border-radius: 15px; border: 1px solid var(--primary); display: flex; align-items: center; gap: 8px; font-size: 0.9em; }

        .friend-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .cb-item { display: flex; align-items: center; gap: 5px; background: var(--input-bg); padding: 5px 10px; border-radius: 5px; font-size: 0.9em; border: 1px solid var(--border); }

        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); margin-bottom: 4px; border-radius: 4px; }
        .details { font-size: 0.8em; color: var(--text-muted); }

        .summary-box { background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), transparent); padding: 15px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.2); }
        .total-row { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); font-size: 1.2em; }
        .person-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); }
        .btn-tool:disabled { opacity: .38; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <div style="display:flex; gap:5px">
            <button class="btn-tool admin-only" onclick="saveToFile()">💾 บันทึก</button>
            <button class="btn-tool admin-only" onclick="document.getElementById('fileInput').click()">📂 เปิด</button>
            <button id="undoBtn" class="btn-tool admin-only" onclick="undo()" disabled title="ย้อนกลับการเปลี่ยนแปลงล่าสุด">↶ ย้อนกลับ</button>
            <button id="redoBtn" class="btn-tool admin-only" onclick="redo()" disabled title="ทำซ้ำการเปลี่ยนแปลงที่ย้อนไป">↷ ไปข้างหน้า</button>
        </div>
        <button class="btn-tool btn-share admin-only" onclick="generateShareLink()">🔗 ส่งลิงก์ให้เพื่อน</button>
    </div>

    <h1>🥘 หารค่าอาหาร</h1>

    <div class="section admin-only">
        <h3>1. รายชื่อเพื่อน</h3>
        <div class="input-group">
            <input type="text" id="friendName" placeholder="เพิ่มชื่อ..." onkeypress="if(event.key==='Enter')addFriend()">
            <button class="btn-gold" style="width:auto" onclick="addFriend()">เพิ่ม</button>
        </div>
        <div id="friendListDisplay" class="friend-list-area"></div>
    </div>

    <div class="section admin-only">
        <h3>2. รายการอาหาร</h3>
        <div class="input-group">
            <input type="text" id="foodName" placeholder="ชื่อเมนู" style="flex:2">
            <input type="number" id="foodPrice" placeholder="ราคา" style="flex:1">
        </div>
        <div id="friendCheckboxes" class="friend-checkboxes"></div>
        <button class="btn-gold" style="margin-top:10px" onclick="addFoodItem()">+ บันทึกรายการ</button>
    </div>

    <div class="section">
        <h3>📝 รายการที่สั่ง</h3>
        <ul id="foodList"></ul>
    </div>

    <div class="summary-box">
        <div class="total-row"><span>ยอดรวมทั้งหมด:</span><span id="grandTotal">0.00 ฿</span></div>
        <div id="resultList" style="margin-top:10px"></div>
    </div>

    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="openFile(event)">
</div>

<script>
    let friends = [];
    let foodItems = [];
    let isReadOnly = false;
    const undoStack = [];
    const redoStack = [];
    const HISTORY_LIMIT = 100;

    function snapshot() {
        return JSON.stringify({ friends, foodItems });
    }

    function updateHistoryButtons() {
        document.getElementById('undoBtn').disabled = isReadOnly || undoStack.length === 0;
        document.getElementById('redoBtn').disabled = isReadOnly || redoStack.length === 0;
    }

    function recordChange() {
        if (isReadOnly) return;
        undoStack.push(snapshot());
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack.length = 0;
    }

    function restore(snapshotText) {
        const state = JSON.parse(snapshotText);
        friends = state.friends;
        foodItems = state.foodItems;
        updateUI();
    }

    function undo() {
        if (isReadOnly || !undoStack.length) return;
        redoStack.push(snapshot());
        restore(undoStack.pop());
    }

    function redo() {
        if (isReadOnly || !redoStack.length) return;
        undoStack.push(snapshot());
        restore(redoStack.pop());
    }

    // --- ระบบแชร์ข้อมูลผ่านลิงก์ ---
    function generateShareLink() {
        if (friends.length === 0) return alert("กรุณาเพิ่มข้อมูลก่อนแชร์");
        const data = JSON.stringify({ f: friends, i: foodItems });
        // ใช้ Unicode-safe Base64 encoding
        const encodedData = btoa(unescape(encodeURIComponent(data)));
        const shareUrl = window.location.origin + window.location.pathname + "#view=" + encodedData;

        navigator.clipboard.writeText(shareUrl).then(() => {
            alert("คัดลอกลิงก์เรียบร้อย! ส่งให้เพื่อนเปิดดูสรุปยอดได้ทันที");
        });
    }

    function checkShareLink() {
        const hash = window.location.hash;
        if (hash.startsWith("#view=")) {
            try {
                const encodedData = hash.replace("#view=", "");
                const decodedData = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
                friends = decodedData.f;
                foodItems = decodedData.i;
                isReadOnly = true;
                applyReadOnlyMode();
                updateUI();
            } catch (e) {
                console.error("Link Error", e);
            }
        }
    }

    function applyReadOnlyMode() {
        // ซ่อนส่วนควบคุมที่เป็นของผู้จัดการหลัก (Admin)
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    }

    // --- ระบบจัดการไฟล์ ---
    function saveToFile() {
        const blob = new Blob([JSON.stringify({ friends, foodItems })], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `bill-summary.json`;
        a.click();
    }

    function openFile(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!Array.isArray(data.friends) || !Array.isArray(data.foodItems)) throw new Error('Invalid file');
                recordChange();
                friends = data.friends;
                foodItems = data.foodItems;
                updateUI();
            } catch(err) { alert("ไฟล์ไม่ถูกต้อง"); }
        };
        if (!e.target.files?.[0]) return;
        reader.readAsText(e.target.files[0]);
        e.target.value = '';
    }

    // --- Logic โปรแกรม ---
    function addFriend() {
        const n = document.getElementById('friendName');
        if (n.value && !friends.includes(n.value)) {
            recordChange();
            friends.push(n.value);
            n.value = '';
            updateUI();
        }
    }

    function removeFriend(n) {
        if(!isReadOnly && confirm(`ลบชื่อ ${n}?`)) {
            recordChange();
            friends = friends.filter(f=>f!==n);
            foodItems.forEach(i=>i.sharers=i.sharers.filter(s=>s!==n));
            updateUI();
        }
    }

    function addFoodItem() {
        const n = document.getElementById('foodName').value;
        const p = parseFloat(document.getElementById('foodPrice').value);
        const s = Array.from(document.querySelectorAll('.friend-check:checked')).map(c=>c.value);
        if(n && p && s.length) {
            recordChange();
            foodItems.push({name:n, price:p, sharers:s});
            document.getElementById('foodName').value = '';
            document.getElementById('foodPrice').value = '';
            updateUI();
        } else {
            alert("กรุณากรอกข้อมูลอาหารและเลือกคนหาร");
        }
    }

    function removeFoodItem(idx) {
        if (isReadOnly || idx < 0 || idx >= foodItems.length) return;
        recordChange();
        foodItems.splice(idx, 1);
        updateUI();
    }

    function updateUI() {
        // แสดงชื่อเพื่อน
        const fDisp = document.getElementById('friendListDisplay');
        fDisp.innerHTML = friends.map(f => `
            <div class="friend-tag">
                ${f}
                ${isReadOnly ? '' : `<span onclick="removeFriend('${f}')" style="cursor:pointer; color:var(--text-muted)">✕</span>`}
            </div>
        `).join('') || '<span style="color:var(--text-muted); font-size:0.8em; margin:auto;">ยังไม่มีชื่อเพื่อน</span>';

        // แสดง Checkboxes
        const cbDisp = document.getElementById('friendCheckboxes');
        cbDisp.innerHTML = friends.map(f => `<label class="cb-item"><input type="checkbox" class="friend-check" value="${f}" checked> ${f}</label>`).join('');

        // แสดงรายการอาหาร
        const fList = document.getElementById('foodList');
        fList.innerHTML = foodItems.map((item, idx) => `
            <li>
                <div>
                    <strong>${item.name}</strong> <span style="color:var(--primary)">${item.price.toLocaleString()} ฿</span>
                    <div class="details">คนหาร: ${item.sharers.join(', ')}</div>
                </div>
                ${isReadOnly ? '' : `<button class="btn-del" onclick="removeFoodItem(${idx})">ลบ</button>`}
            </li>`).join('') || '<li style="justify-content:center; color:var(--text-muted); background:none; border:none;">ยังไม่มีรายการอาหาร</li>';

        // คำนวณเงิน
        let total = 0, sum = {};
        friends.forEach(f => sum[f] = 0);
        foodItems.forEach(item => {
            total += item.price;
            if(item.sharers.length > 0) {
                const perHead = item.price / item.sharers.length;
                item.sharers.forEach(s => { if(sum[s]!==undefined) sum[s]+=perHead; });
            }
        });

        document.getElementById('grandTotal').innerText = total.toLocaleString(undefined, {minimumFractionDigits:2}) + ' ฿';
        document.getElementById('resultList').innerHTML = friends.map(f => `
            <div class="person-row">
                <span>${f}</span>
                <span style="color:var(--primary); font-weight:bold">${Math.round(sum[f]).toLocaleString('th-TH', {maximumFractionDigits:0})} ฿</span>
            </div>
        `).join('') || '<p style="text-align:center; color:var(--text-muted);">รอการคำนวณ...</p>';
        updateHistoryButtons();
    }

    // เริ่มการตรวจสอบลิงก์เมื่อเปิดหน้าเว็บ
    checkShareLink();
    updateUI();
</script>
</body>
</html>
